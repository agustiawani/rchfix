<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyyss React – Kirim Reaksi Unlimited</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: #1a1f2b;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a3140;
        }
        h1 {
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #8b9bb5;
            margin-left: auto;
        }
        .badge {
            background: #2563eb;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        label {
            display: block;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 6px;
            color: #c8d0dc;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2e384a;
            background: #0f131c;
            color: #e8edf5;
            font-size: 15px;
            transition: 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
        }
        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row > * { flex: 1; min-width: 120px; }
        .emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .emoji-btn {
            font-size: 30px;
            padding: 8px 14px;
            background: #0f131c;
            border: 2px solid #2e384a;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1;
        }
        .emoji-btn.active {
            border-color: #3b82f6;
            background: #1e2a4a;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(59,130,246,0.3);
        }
        .emoji-btn:hover {
            background: #1a2233;
        }
        button[type="submit"] {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button[type="submit"]:hover {
            background: #2563eb;
            transform: scale(1.01);
        }
        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 24px;
            padding: 16px;
            background: #0f131c;
            border-radius: 14px;
            white-space: pre-wrap;
            font-size: 13px;
            max-height: 480px;
            overflow-y: auto;
            display: none;
            border: 1px solid #2e384a;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }
        #result .ok { color: #4ade80; }
        #result .fail { color: #f87171; }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2e384a;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .stats span {
            background: #1e2638;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 600;
        }
        .stats .ok { background: #064e3b; color: #6ee7b7; }
        .stats .fail { background: #4c0519; color: #fca5a5; }
        .version-select {
            background: #0f131c;
            border: 1px solid #2e384a;
            border-radius: 12px;
            padding: 10px 14px;
            color: #e8edf5;
        }
        .hint {
            color: #8b9bb5;
            font-size: 13px;
            margin-top: 4px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f131c; }
        ::-webkit-scrollbar-thumb { background: #2e384a; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>
        ⚡ Keyyss React
        <small><span class="badge">Unlimited</span></small>
    </h1>

    <form id="testForm">
        <label for="url">🔗 URL Channel / Postingan</label>
        <input type="url" id="url" placeholder="https://whatsapp.com/channel/..." required />

        <label>😀 Pilih Emoji (klik toggle, max 6)</label>
        <div class="emoji-grid" id="emojiGrid">
            <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
            <button type="button" class="emoji-btn" data-emoji="😂">😂</button>
            <button type="button" class="emoji-btn" data-emoji="😮">😮</button>
            <button type="button" class="emoji-btn" data-emoji="😢">😢</button>
            <button type="button" class="emoji-btn" data-emoji="😡">😡</button>
            <button type="button" class="emoji-btn" data-emoji="👍">👍</button>
            <button type="button" class="emoji-btn" data-emoji="👎">👎</button>
            <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
            <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
            <button type="button" class="emoji-btn" data-emoji="😍">😍</button>
            <button type="button" class="emoji-btn" data-emoji="💯">💯</button>
            <button type="button" class="emoji-btn" data-emoji="🙌">🙌</button>
        </div>
        <input type="hidden" id="selectedEmojis" value="[]" />

        <div class="row">
            <div>
                <label for="version">⚙️ Versi API</label>
                <select id="version" class="version-select">
                    <option value="v2">v2 – Unlimited Turbo</option>
                    <option value="v1">v1 – Basic</option>
                </select>
            </div>
            <div>
                <label for="multiplier">📈 Multiplier (v2)</label>
                <input type="number" id="multiplier" min="1" max="10" value="1" />
                <div class="hint">1 = 1 reaksi per emoji</div>
            </div>
        </div>

        <div class="row">
            <div>
                <label for="jumlah">🔢 Jumlah kirim (max 100)</label>
                <input type="number" id="jumlah" min="1" max="100" value="5" />
            </div>
            <div>
                <label for="delay">⏱️ Jeda (ms)</label>
                <input type="number" id="delay" min="100" max="10000" value="800" />
            </div>
        </div>

        <button type="submit" id="submitBtn">
            🚀 Kirim Reaksi
        </button>
    </form>

    <div id="result"></div>
</div>

<script>
    (function() {
        const form = document.getElementById('testForm');
        const urlInput = document.getElementById('url');
        const versionSelect = document.getElementById('version');
        const multiplierInput = document.getElementById('multiplier');
        const jumlahInput = document.getElementById('jumlah');
        const delayInput = document.getElementById('delay');
        const selectedEmojisHidden = document.getElementById('selectedEmojis');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        const emojiBtns = document.querySelectorAll('.emoji-btn');

        let selectedEmojis = [];

        // Toggle emoji (max 6)
        emojiBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const emoji = this.dataset.emoji;
                const idx = selectedEmojis.indexOf(emoji);
                if (idx === -1) {
                    if (selectedEmojis.length >= 6) {
                        alert('Maksimal 6 emoji!');
                        return;
                    }
                    selectedEmojis.push(emoji);
                    this.classList.add('active');
                } else {
                    selectedEmojis.splice(idx, 1);
                    this.classList.remove('active');
                }
                selectedEmojisHidden.value = JSON.stringify(selectedEmojis);
            });
        });

        // Submit
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const url = urlInput.value.trim();
            const version = versionSelect.value;
            const multiplier = parseInt(multiplierInput.value, 10) || 1;
            const jumlah = parseInt(jumlahInput.value, 10) || 1;
            const delayMs = parseInt(delayInput.value, 10) || 800;

            if (!url) { alert('URL wajib diisi!'); return; }
            if (selectedEmojis.length === 0) { alert('Pilih minimal 1 emoji!'); return; }
            if (jumlah < 1 || jumlah > 100) { alert('Jumlah harus 1–100'); return; }
            if (delayMs < 100) { alert('Delay minimal 100ms'); return; }

            const payload = {
                url,
                emojis: selectedEmojis,
                jumlah,
                delayMs,
                version,
                multiplier: version === 'v2' ? multiplier : 1
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> Mengirim...';
            resultDiv.style.display = 'block';
            resultDiv.textContent = '⏳ Memproses...';

            try {
                const response = await fetch('/api/react', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success !== undefined) {
                    let text = `✅ ${data.message}\n`;
                    text += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    text += `📊 Statistik:\n`;
                    text += `   ✅ Berhasil: ${data.data.successCount}\n`;
                    text += `   ❌ Gagal:    ${data.data.failedCount}\n`;
                    text += `   ⚡ Versi:    ${data.data.version.toUpperCase()}\n`;
                    text += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    text += `📋 Detail per percobaan:\n`;
                    data.data.results.forEach((r, i) => {
                        const status = r.success ? '✅' : '❌';
                        let detail = `  ${i+1}. ${status} ${r.message}`;
                        if (r.taskId) detail += ` | Task: ${r.taskId}`;
                        if (r.worker) detail += ` | Worker: ${r.worker}`;
                        if (r.responseTime) detail += ` | ⏱️ ${r.responseTime}`;
                        text += detail + '\n';
                    });
                    resultDiv.textContent = text;
                } else {
                    resultDiv.textContent = `❌ Error: ${data.message || 'Terjadi kesalahan'}`;
                }
            } catch (err) {
                resultDiv.textContent = `❌ Gagal koneksi: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '🚀 Kirim Reaksi';
            }
        });

        // Default pilih satu emoji
        const firstBtn = document.querySelector('.emoji-btn');
        if (firstBtn) firstBtn.click();
    })();
</script>
</body>
</html>
