<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyyss React – Kirim Reaksi Unlimited</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: #1a1f2b;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a3140;
        }
        h1 {
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #8b9bb5;
            margin-left: auto;
        }
        .badge {
            background: #2563eb;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        label {
            display: block;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #c8d0dc;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2e384a;
            background: #0f131c;
            color: #e8edf5;
            font-size: 15px;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
        }
        .emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .emoji-btn {
            font-size: 30px;
            padding: 8px 14px;
            background: #0f131c;
            border: 2px solid #2e384a;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1;
        }
        .emoji-btn.active {
            border-color: #3b82f6;
            background: #1e2a4a;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(59,130,246,0.3);
        }
        .emoji-btn:hover {
            background: #1a2233;
        }

        /* === MODE CARDS === */
        .mode-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }
        .mode-card {
            background: #0f131c;
            border: 2px solid #2e384a;
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        .mode-card:hover {
            border-color: #4b5a7a;
            background: #161e2e;
        }
        .mode-card.active {
            border-color: #3b82f6;
            background: #1a2744;
            box-shadow: 0 0 20px rgba(59,130,246,0.15);
            transform: scale(1.02);
        }
        .mode-card .mode-title {
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mode-card .mode-desc {
            font-size: 13px;
            color: #8b9bb5;
            margin-top: 4px;
        }
        .mode-card .mode-spec {
            font-size: 12px;
            color: #6a7d9e;
            margin-top: 6px;
            background: #0b0e14;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-block;
        }

        /* === BUTTON === */
        button[type="submit"] {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button[type="submit"]:hover {
            background: #2563eb;
            transform: scale(1.01);
        }
        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 24px;
            padding: 16px;
            background: #0f131c;
            border-radius: 14px;
            white-space: pre-wrap;
            font-size: 13px;
            max-height: 480px;
            overflow-y: auto;
            display: none;
            border: 1px solid #2e384a;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2e384a;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .stats span {
            background: #1e2638;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 600;
        }
        .stats .ok { background: #064e3b; color: #6ee7b7; }
        .stats .fail { background: #4c0519; color: #fca5a5; }
        .hint { color: #8b9bb5; font-size: 13px; margin-top: 4px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f131c; }
        ::-webkit-scrollbar-thumb { background: #2e384a; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>
        ⚡ Keyyss React
        <small><span class="badge">Unlimited</span></small>
    </h1>

    <form id="testForm">
        <!-- URL -->
        <label for="url">🔗 URL Channel / Postingan</label>
        <input type="url" id="url" placeholder="https://whatsapp.com/channel/..." required />

        <!-- Emoji -->
        <label>😀 Pilih Emoji (klik toggle, max 6)</label>
        <div class="emoji-grid" id="emojiGrid">
            <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
            <button type="button" class="emoji-btn" data-emoji="😂">😂</button>
            <button type="button" class="emoji-btn" data-emoji="😮">😮</button>
            <button type="button" class="emoji-btn" data-emoji="😢">😢</button>
            <button type="button" class="emoji-btn" data-emoji="😡">😡</button>
            <button type="button" class="emoji-btn" data-emoji="👍">👍</button>
            <button type="button" class="emoji-btn" data-emoji="👎">👎</button>
            <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
            <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
            <button type="button" class="emoji-btn" data-emoji="😍">😍</button>
            <button type="button" class="emoji-btn" data-emoji="💯">💯</button>
            <button type="button" class="emoji-btn" data-emoji="🙌">🙌</button>
        </div>
        <input type="hidden" id="selectedEmojis" value="[]" />

        <!-- MODE SELECTION -->
        <label>⚙️ Pilih Mode Kecepatan</label>
        <div class="mode-grid" id="modeGrid">
            <div class="mode-card active" data-mode="normal">
                <div class="mode-title">🛡️ Normal (Aman)</div>
                <div class="mode-desc">Jeda 1000ms · 5x Kirim</div>
                <div class="mode-spec">1x per emoji</div>
            </div>
            <div class="mode-card" data-mode="turbo">
                <div class="mode-title">⚡ Turbo (Cepat)</div>
                <div class="mode-desc">Jeda 150ms · 2x Kirim</div>
                <div class="mode-spec">5x per emoji</div>
            </div>
            <div class="mode-card" data-mode="booster">
                <div class="mode-title">🚀 Booster (Besar)</div>
                <div class="mode-desc">Jeda 500ms · 5x Kirim</div>
                <div class="mode-spec">10x per emoji</div>
            </div>
        </div>

        <button type="submit" id="submitBtn">
            🚀 Kirim Reaksi (Mode Normal)
        </button>
    </form>

    <div id="result"></div>
</div>

<script>
    (function() {
        const form = document.getElementById('testForm');
        const urlInput = document.getElementById('url');
        const selectedEmojisHidden = document.getElementById('selectedEmojis');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        const emojiBtns = document.querySelectorAll('.emoji-btn');
        const modeCards = document.querySelectorAll('.mode-card');

        let selectedEmojis = [];
        let currentMode = 'normal'; // default

        // === 1. Konfigurasi Mode ===
        const MODES = {
            normal: { version: 'v2', multiplier: 1, delayMs: 1000, jumlah: 5, label: 'Normal' },
            turbo: { version: 'v2', multiplier: 5, delayMs: 150, jumlah: 2, label: 'Turbo' },
            booster: { version: 'v2', multiplier: 10, delayMs: 500, jumlah: 5, label: 'Booster' }
        };

        // === 2. Toggle Emoji ===
        emojiBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const emoji = this.dataset.emoji;
                const idx = selectedEmojis.indexOf(emoji);
                if (idx === -1) {
                    if (selectedEmojis.length >= 6) {
                        alert('Maksimal 6 emoji!');
                        return;
                    }
                    selectedEmojis.push(emoji);
                    this.classList.add('active');
                } else {
                    selectedEmojis.splice(idx, 1);
                    this.classList.remove('active');
                }
                selectedEmojisHidden.value = JSON.stringify(selectedEmojis);
            });
        });

        // === 3. Pilih Mode (Card) ===
        modeCards.forEach(card => {
            card.addEventListener('click', function() {
                // Hapus active dari semua card
                modeCards.forEach(c => c.classList.remove('active'));
                // Aktifkan card yang diklik
                this.classList.add('active');
                // Simpan mode
                currentMode = this.dataset.mode;
                // Update tombol submit
                const modeLabel = MODES[currentMode].label;
                submitBtn.innerHTML = `🚀 Kirim Reaksi (Mode ${modeLabel})`;
            });
        });

        // === 4. Submit Form ===
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const url = urlInput.value.trim();
            const emojis = selectedEmojis;

            if (!url) { alert('URL wajib diisi!'); return; }
            if (emojis.length === 0) { alert('Pilih minimal 1 emoji!'); return; }

            // Ambil konfigurasi berdasarkan mode yang dipilih
            const config = MODES[currentMode];

            const payload = {
                url,
                emojis: emojis,
                version: config.version,
                multiplier: config.multiplier,
                jumlah: config.jumlah,
                delayMs: config.delayMs
            };

            // Disable tombol & tampilkan loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> Mengirim...';
            resultDiv.style.display = 'block';
            resultDiv.textContent = `⏳ Memproses (Mode ${config.label})...`;

            try {
                const response = await fetch('/api/react', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success !== undefined) {
                    let text = `✅ ${data.message}\n`;
                    text += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    text += `📊 Statistik:\n`;
                    text += `   ✅ Berhasil: ${data.data.successCount}\n`;
                    text += `   ❌ Gagal:    ${data.data.failedCount}\n`;
                    text += `   ⚡ Mode:     ${config.label.toUpperCase()}\n`;
                    text += `   📈 Multiplier: ${config.multiplier}x\n`;
                    text += `━━━━━━━━━━━━━━━━━━━━━\n`;
                    text += `📋 Detail per percobaan:\n`;
                    data.data.results.forEach((r, i) => {
                        const status = r.success ? '✅' : '❌';
                        let detail = `  ${i+1}. ${status} ${r.message}`;
                        if (r.taskId) detail += ` | Task: ${r.taskId}`;
                        if (r.worker) detail += ` | Worker: ${r.worker}`;
                        if (r.responseTime) detail += ` | ⏱️ ${r.responseTime}`;
                        text += detail + '\n';
                    });
                    resultDiv.textContent = text;
                } else {
                    resultDiv.textContent = `❌ Error: ${data.message || 'Terjadi kesalahan'}`;
                }
            } catch (err) {
                resultDiv.textContent = `❌ Gagal koneksi: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `🚀 Kirim Reaksi (Mode ${config.label})`;
            }
        });

        // === 5. Default: pilih emoji pertama & set mode normal ===
        const firstBtn = document.querySelector('.emoji-btn');
        if (firstBtn) firstBtn.click();

        // Tandai mode normal sebagai default (sudah ada class active di HTML)
        // Tapi kita set ulang teks tombol agar sesuai
        submitBtn.innerHTML = '🚀 Kirim Reaksi (Mode Normal)';
    })();
</script>
</body>
</html>
